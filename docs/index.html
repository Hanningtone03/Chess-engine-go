<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>chess-engine-go</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <div class="captures-panel">
      <h2>Black captured</h2>
      <div id="capturedByBlack" class="captured-row"></div>
      <h2>White captured</h2>
      <div id="capturedByWhite" class="captured-row"></div>
    </div>

    <div class="board-panel">
      <canvas id="board" width="560" height="560"></canvas>
      <div id="status" class="status">White to move</div>
    </div>

    <div class="side-panel">
      <h1>chess-engine-go</h1>
      <p class="subtitle">Go alpha-beta engine, playing as Black</p>

      <button id="newGameBtn">New Game</button>

      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="500">Easy</option>
        <option value="1500" selected>Medium</option>
        <option value="4000">Hard</option>
        <option value="10000">Master</option>
      </select>

      <h2>Moves</h2>
      <ol id="moveList" class="move-list"></ol>
    </div>
  </div>

  <div id="promoModal" class="modal hidden">
    <div class="modal-content">
      <p>Promote to:</p>
      <button data-promo="q">Queen</button>
      <button data-promo="r">Rook</button>
      <button data-promo="b">Bishop</button>
      <button data-promo="n">Knight</button>
    </div>
  </div>

  <div id="winModal" class="modal hidden">
    <div class="modal-content">
      <p id="winMessage">Game over</p>
      <button id="winCloseBtn">Close</button>
    </div>
  </div>

  <script src="board.js"></script>
</body>
</html>
